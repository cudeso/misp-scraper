name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: leaked secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
      # Known placeholders are listed in .gitleaksignore
      - run: ./gitleaks git . --redact --verbose

  dependencies:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # requirements.txt has some pins only for 3.10 and 3.11, and pip-audit
    # reads the pins for the Python it runs on, so it runs on both ends.
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install 'pip-audit>=2.7,<3'
      # The lock rather than the environment: the environment also holds
      # pip-audit and whatever the runner's Python ships with, such as
      # setuptools on 3.10, none of which misp-scraper installs. The lock pins
      # every package, so --no-deps leaves nothing out.
      - run: pip-audit -r requirements.txt --no-deps --disable-pip --strict --progress-spinner off
